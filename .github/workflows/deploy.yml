name: Deploy HousingUtilitiesSystemAdmin

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/housing-utilities-admin
  CONTAINER_NAME: housing-utilities-admin

jobs:
  # ============================================================================
  # Job 1: Build and Test
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test with Maven
        run: mvn clean verify -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ============================================================================
  # Job 2: Build and Push Docker Image
  # ============================================================================
  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 3: Deploy to Server
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    environment: production
    
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            
            # Variables
            CONTAINER_NAME="housing-utilities-admin"
            IMAGE="ghcr.io/${{ github.repository_owner }}/housing-utilities-admin:latest"
            NETWORK_NAME="housing-network"
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create network if not exists
            docker network create $NETWORK_NAME 2>/dev/null || true
            
            # Ensure infrastructure services are running
            if ! docker ps | grep -q "mongo"; then
              echo "Starting MongoDB..."
              docker run -d \
                --name mongo \
                --network $NETWORK_NAME \
                --restart unless-stopped \
                -p 27017:27017 \
                -v mongo-data:/data/db \
                mongo:latest
            fi
            
            if ! docker ps | grep -q "elasticsearch"; then
              echo "Starting Elasticsearch..."
              docker run -d \
                --name elasticsearch \
                --network $NETWORK_NAME \
                --restart unless-stopped \
                -p 9200:9200 \
                -e "discovery.type=single-node" \
                -e "xpack.security.enabled=false" \
                -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
                -v elasticsearch-data:/usr/share/elasticsearch/data \
                docker.elastic.co/elasticsearch/elasticsearch:8.16.1
            fi
            
            if ! docker ps | grep -q "redis"; then
              echo "Starting Redis..."
              docker run -d \
                --name redis \
                --network $NETWORK_NAME \
                --restart unless-stopped \
                -p 6379:6379 \
                -v redis-data:/data \
                redis:latest
            fi
            
            # Pull latest image
            echo "Pulling latest image..."
            docker pull $IMAGE
            
            # Stop and remove old container (redeploy support)
            echo "Stopping old container..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true
            
            # Create uploads directory
            mkdir -p /opt/housing-uploads
            
            # Run new container
            echo "Starting new container..."
            docker run -d \
              --name $CONTAINER_NAME \
              --network $NETWORK_NAME \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_DATA_MONGODB_URI="mongodb://mongo:27017/HousingUtilitiesSystemDB" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e OAUTH_GOOGLE_CLIENT_ID="${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}" \
              -e OAUTH_GOOGLE_CLIENT_SECRET="${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}" \
              -e SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY }}" \
              -e SENDGRID_FROM_EMAIL="${{ secrets.SENDGRID_FROM_EMAIL }}" \
              -e ELASTICSEARCH_URIS="http://elasticsearch:9200" \
              -e SPRING_DATA_REDIS_HOST="redis" \
              -e SPRING_PROFILES_ACTIVE="docker" \
              -v /opt/housing-uploads:/app/uploads \
              $IMAGE
            
            # Wait for container to start
            echo "Waiting for container to start..."
            sleep 20
            
            # Cleanup old images
            docker image prune -f
            
            echo "✅ Deployment completed!"

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            CONTAINER_NAME="housing-utilities-admin"
            
            # Check if container is running
            if docker ps | grep -q $CONTAINER_NAME; then
              echo "✅ Container is running"
            else
              echo "❌ Container is not running"
              docker logs $CONTAINER_NAME --tail 100 2>/dev/null || echo "No logs available"
              exit 1
            fi
            
            # Check application health (with retry)
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/admin/login > /dev/null 2>&1; then
                echo "✅ Application is healthy"
                exit 0
              fi
              echo "Attempt $i: Waiting for application..."
              sleep 10
            done
            
            echo "❌ Application health check failed"
            docker logs $CONTAINER_NAME --tail 100
            exit 1
